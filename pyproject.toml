[tool.poetry]
name = "magic_hour"
version = "0.76.0"
description = "Python SDK for Magic Hour API"
readme = "README.md"
authors = []
packages = [{ include = "magic_hour" }]
homepage = "https://magichour.ai"
repository = "https://github.com/magichourhq/magic-hour-python"
documentation = "https://docs.magichour.ai"
keywords = [
    "magic-hour",
    "generative-ai",
    "ai-video",
    "ai-image",
    "ai-audio",
    "video-generation",
    "image-generation",
    "audio-generation",
    "text-to-video",
    "image-to-video",
    "face-swap",
    "lip-sync",
    "sdk",
    "api",
]

[tool.poetry.dependencies]
python = "^3.8"
make-api-request = "^0.1.3"

[tool.poetry.dev-dependencies]
mypy = "^1.8.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.23.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
